services:
  relay:
    build:
      context: ..
      dockerfile: apps/relay/Dockerfile
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 4177
      NODE_ENV: production
      CODEX_COLLAB_DATA_DIR: /data
      CODEX_COLLAB_PUBLIC_URL: https://${CODEX_COLLAB_DOMAIN}
      CODEX_COLLAB_TRUST_PROXY: "1"
    ports:
      - "127.0.0.1:${CODEX_COLLAB_HOST_PORT:-4178}:4177"
    volumes:
      - relay-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4177/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      proxy:
        aliases:
          - secondary-relay

networks:
  proxy:
    external: true
    name: ${CODEX_COLLAB_PROXY_NETWORK:-codex-collab_collab}

volumes:
  relay-data:
