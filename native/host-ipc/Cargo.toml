[package]
name = "codex-collab-host-ipc"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[dependencies]
base64 = "0.22.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
subtle = "2.6.1"
zeroize = "1.8.2"

[dependencies.windows-sys]
version = "0.61.2"
features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
]

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
